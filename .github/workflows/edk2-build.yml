name: EDK2 Build + Boot Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm iasl uuid-dev qemu-system-x86 python3 python3-pip gnupg ca-certificates xvfb

      - name: Install Mono (required by stuart's NuGet-based dependency fetching on Linux)
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update
          sudo apt-get install -y mono-devel

      - name: Clone EDK2
        run: |
          git clone --recursive --depth 1 https://github.com/tianocore/edk2.git

      - name: Install TianoCore's official CI tooling (edk2-pytool-extensions)
        working-directory: edk2
        run: |
          pip install --upgrade -r pip-requirements.txt

      - name: Build BaseTools (GenSec, GenFfs, GenFv, etc.)
        working-directory: edk2
        run: |
          make -C BaseTools

      - name: stuart_setup
        working-directory: edk2
        run: |
          stuart_setup -c OvmfPkg/PlatformCI/PlatformBuild.py TOOL_CHAIN_TAG=GCC -a X64

      - name: stuart_update
        working-directory: edk2
        run: |
          stuart_update -c OvmfPkg/PlatformCI/PlatformBuild.py TOOL_CHAIN_TAG=GCC -a X64

      - name: stuart_build (compile OVMF)
        working-directory: edk2
        run: |
          stuart_build -c OvmfPkg/PlatformCI/PlatformBuild.py TOOL_CHAIN_TAG=GCC -a X64

      - name: Copy custom firmware source into the EDK2 tree
        run: |
          mkdir -p edk2/Source edk2/Platform
          cp -r Source/* edk2/Source/
          cp Platform/ServerPlatform.dsc edk2/Platform/

      - name: Build custom platform firmware
        working-directory: edk2
        run: |
          source edksetup.sh
          build -p Platform/ServerPlatform.dsc -a X64 -t GCC -b DEBUG

      - name: Boot the platform and capture output (generic, no hardcoded app names)
        run: |
          bash scripts/run_platform_boot_test.sh

      - name: Install pytest
        run: pip install pytest

      - name: Run boot-integration tests
        run: pytest Tests/BootTests/ -v

      - name: Upload built firmware
        uses: actions/upload-artifact@v4
        with:
          name: ovmf-firmware
          path: edk2/Build/OvmfX64/DEBUG_GCC/FV/OVMF_CODE.fd

      - name: Upload custom platform applications
        uses: actions/upload-artifact@v4
        with:
          name: platform-applications
          path: edk2/Build/ServerPlatform/DEBUG_GCC/X64/*.efi

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Compile and run all unit tests (auto-discovered, no hardcoded filenames)
        run: |
          LOGIC_FILES=$(find Source -name "*.c" ! -name "*App.c")
          for test_file in Tests/UnitTests/test_*.c; do
            echo "=== Running $test_file ==="
            gcc -I Source/FanControl "$test_file" $LOGIC_FILES -o /tmp/unit_test_bin
            /tmp/unit_test_bin
          done