name: EDK2 Build + Boot Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm iasl uuid-dev qemu-system-x86 python3 python3-pip

      - name: Clone EDK2
        run: |
          git clone --recursive --depth 1 https://github.com/tianocore/edk2.git

      - name: Install TianoCore's official CI tooling (edk2-pytool-extensions)
        working-directory: edk2
        run: |
          pip install --upgrade -r pip-requirements.txt

      - name: stuart_setup
        working-directory: edk2
        run: |
          stuart_setup -c OvmfPkg/PlatformCI/PlatformBuild.py TOOL_CHAIN_TAG=GCC -a X64

      - name: stuart_update
        working-directory: edk2
        run: |
          stuart_update -c OvmfPkg/PlatformCI/PlatformBuild.py TOOL_CHAIN_TAG=GCC -a X64

      - name: stuart_build (compile OVMF)
        working-directory: edk2
        run: |
          stuart_build -c OvmfPkg/PlatformCI/PlatformBuild.py TOOL_CHAIN_TAG=GCC -a X64

      - name: Boot-test in headless QEMU (official TianoCore mechanism)
        working-directory: edk2
        env:
          QEMU_HEADLESS: "TRUE"
          MAKE_STARTUP_NSH: "TRUE"
        run: |
          stuart_build -c OvmfPkg/PlatformCI/PlatformBuild.py TOOL_CHAIN_TAG=GCC -a X64 --FlashOnly

      - name: Upload built firmware
        uses: actions/upload-artifact@v4
        with:
          name: ovmf-firmware
          path: edk2/Build/OvmfX64/DEBUG_GCC/FV/OVMF_CODE.fd